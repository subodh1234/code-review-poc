# The review job lives in RippeyAi/.github and is shared across repos.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    uses: RippeyAi/.github/.github/workflows/claude-code-review.yml@main
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
